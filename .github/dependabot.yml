# Weekly dependency updates, grouped to keep the PR count low. Commit prefixes
# follow docs/conventions.md; github-actions updates also move the pinned SHAs
# (ADR 0018).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    ignore:
      # Follows the Node major in web/.nvmrc, bumped by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must move together with the pinned Playwright image and the visual
      # baselines in ci.yml (ADR 0044), so it is bumped by hand.
      - dependency-name: "@playwright/test"
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    ignore:
      # The Node major is pinned in web/.nvmrc and the Dockerfile together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]
