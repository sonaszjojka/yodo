name: Bug report
description: Something does not work as expected
labels: [bug, needs-triage]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Usage mode
      options: [Hosted (GitHub Pages), Self-hosted (Docker), Not sure]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag (e.g. 1.0.0) or "hosted"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 130 on macOS 15
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Draw a rectangle\n2. ..."
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors, a sample .yodo file
      description: Do not attach drawings with private content.
