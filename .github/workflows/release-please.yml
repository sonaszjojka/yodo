# Keeps a "release X.Y.Z" PR open from the Conventional Commits on main;
# merging it tags vX.Y.Z and creates the GitHub Release (ADR 0058). The tag
# then runs the image and Pages jobs in ci.yml. Tags made with GITHUB_TOKEN do
# not trigger other workflows, so set the RELEASE_PLEASE_TOKEN secret (a
# fine-grained PAT with contents + pull requests write on this repo).
name: Release
on:
  push:
    branches: [main]
# No token permissions by default; the job asks only for what it needs.
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
