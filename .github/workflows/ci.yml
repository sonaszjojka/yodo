# CI for web/ and server/, plus the GitHub Pages deploy on release tags (ADR 0018, 0057).
# Only the `ci` gate job is a required check; it always reports, so PRs that
# skip web or server through the path filters can still merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Stable releases only (ADR 0049); `v1.0.0-rc1` does not match.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped on a release tag: the tagged commit is on `main`, which passed this
  # workflow already, so only the image is built (ADR 0049).
  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Workflow edits count as both, so they exercise every job.
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            server:
              - 'server/**'
              - '.github/workflows/**'
            docker:
              - 'web/**'
              - 'server/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'
            e2e:
              - 'e2e/**'
              - '.github/workflows/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./...
      # Install only, then run the same commands as locally (ADR 0017).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          install-only: true
      - run: golangci-lint run
      - run: golangci-lint fmt --diff

  # The repository contract suite against the real Go server (ADR 0031).
  # Both sides of the API are under test, so either path triggers it.
  web-server:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run test:server

  # Playwright flows in both usage modes and three browsers (ADR 0035). They
  # run the web build and the Go server, so any of the three paths triggers it.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
        working-directory: web
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The export visual baseline (ADR 0044). It runs in the same pinned image the
  # baselines were made in (`npm run test:visual:update`), not on the bare
  # runner, so a runner update can't change how pixels render. Keep the image
  # tag equal to @playwright/test in e2e/package.json: with a different one
  # the browsers are missing and the job fails loudly.
  visual:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright test -c playwright.visual.config.ts
        working-directory: e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: e2e/playwright-report
          retention-days: 14

  # Builds the multi-arch image on every PR (proves the Dockerfile works),
  # pushes `edge` to GHCR on merge to main (ADR 0019) and the version tags and
  # `latest` on a release tag (ADR 0049).
  docker:
    needs: changes
    # `changes` is skipped on a tag, so a status function is needed for this
    # job to run at all.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.docker == 'true') }}
    # Release jobs queue one at a time, so the tag check below always sees every
    # tag pushed before this job started and an older build can't finish last
    # and move `latest` back. Other runs keep the workflow's own group.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-image' || format('docker-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing on release tags (OIDC identity).
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag check below needs the history and every tag.
          fetch-depth: 0
      # `latest` is the newest release, so a tag may only publish if its commit
      # is on `main` and no higher version exists. This also stops a rerun of
      # an old tag from moving `latest` back (ADR 0049).
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME is not the highest release tag ($highest)"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is set by hand below, not by the action's own rule.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance and an SBOM are attached to the pushed image.
          provenance: mode=max
          sbom: true
      # Release images are signed so users can verify where they came from
      # (see "Verify the image" in the README).
      - name: Install cosign
        if: env.PUSH == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the release image
        if: env.PUSH == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  ci:
    needs: [changes, web, web-server, server, e2e, visual, docker, pages-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."

  # The hosted app deploys from a release tag only, never from a merge to main
  # (ADR 0057). The tagged commit passed CI when it merged, so only the web
  # build is repeated here, with the same tag guard as the image.
  pages-build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the release tag
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME is not the highest release tag ($highest)"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: pages-build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
